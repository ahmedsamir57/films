<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Movie Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: linear-gradient(135deg, #4b0710, #17171d);
      border-bottom: 2px solid #e62429;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    header p {
      color: #d0d0d0;
      margin: 0;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }

    .stats {
      margin-bottom: 20px;
      color: #ddd;
      font-size: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    input, select {
      flex: 1;
      min-width: 180px;
      padding: 13px;
      border: 1px solid #38383f;
      border-radius: 8px;
      background: #202026;
      color: white;
      font-size: 15px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(
        auto-fit, minmax(175px, 1fr)
      );
      gap: 20px;
    }

    .movie {
      overflow: hidden;
      background: #1c1c23;
      border: 1px solid #303039;
      border-radius: 12px;
      transition: transform 0.2s;
    }

    .movie:hover {
      transform: translateY(-5px);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #303039;
    }

    .movie-info {
      padding: 14px;
    }

    .movie h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    .details {
      color: #bcbcc5;
      font-size: 13px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #e62429;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #bd171c;
    }

    .movie.watched {
      border-color: #35bd83;
    }

    .movie.watched button {
      background: #197c55;
    }

    .empty {
      text-align: center;
      color: #bbb;
      padding: 40px 0;
      grid-column: 1 / -1;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>MARVEL MOVIE TRACKER</h1>
    <p>اكتشف الأفلام ورتّب رحلة مشاهدتك لعالم مارفل</p>
  </header>

  <main class="container">
    <div class="stats" id="stats"></div>

    <div class="controls">
      <input
        id="search"
        type="search"
        placeholder="ابحث عن فيلم..."
        aria-label="البحث عن فيلم"
      >

      <select id="phase" aria-label="تصفية حسب المرحلة">
        <option value="all">كل المراحل</option>
        <option value="1">المرحلة الأولى</option>
        <option value="2">المرحلة الثانية</option>
        <option value="3">المرحلة الثالثة</option>
      </select>

      <select id="status" aria-label="حالة المشاهدة">
        <option value="all">كل الأفلام</option>
        <option value="unwatched">لم أشاهدها</option>
        <option value="watched">شاهدتها</option>
      </select>
    </div>

    <section class="movies" id="movies"></section>
  </main>

  <footer>
    مشروع تجريبي من صنعك لمحبي الأفلام 🎬
  </footer>
